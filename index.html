.tm{font-weight:800;font-size:20px;color:var(--fg)}.tm.low{color:var(--ng)}

.big{font-size:44px;text-align:center;margin:20px 0 4px}.c{text-align:center}
.reset{margin-top:24px;font-size:12px;color:var(--mut)}

.br{margin:8px 0}.bl{display:flex;justify-content:space-between;gap:8px;font-size:13px;flex-wrap:wrap}.bv{font-size:13px;margin-top:2px}.how{font-size:13px;line-height:1.6}.how p{margin:6px 0}h3{font-size:15px;margin:14px 0 4px}

html{background:var(--bg)}body{min-height:100vh;background:radial-gradient(900px 320px at 50% -140px,var(--tint),transparent 70%) no-repeat,var(--bg)}
h1{letter-spacing:.02em;color:var(--ac)}
.bar i{background:linear-gradient(90deg,var(--ac),var(--gold))}
.cov{box-shadow:0 8px 20px -16px rgba(8,60,40,.55);border-left:4px solid var(--ac)}
.card{transition:border-color .15s,box-shadow .15s,transform .08s}.card:hover{border-color:var(--ac);box-shadow:0 6px 16px -12px rgba(8,60,40,.6)}.card:active{transform:scale(.99)}

.btn.alt{box-shadow:none}.btn.alt:hover{border-color:var(--ac)}
.btn.pred{background:linear-gradient(135deg,#136b4c,#1f9d77 62%,#c8a020);color:#fff}
.q{border-top:4px solid var(--gold);box-shadow:0 10px 24px -20px rgba(8,60,40,.6)}
.ch button:hover:not(:disabled){border-color:var(--ac);background:var(--tint)}

.stats div{border-top:3px solid var(--ac)}
.pos{background:var(--ac);color:var(--acfg)}
.card.done{background:var(--tint)}

.wl tr:nth-child(even) td{background:var(--tint)}
.rel{background:var(--card)}

  else L.push(`反応時間は ${rt.toFixed(2)}秒/問で、満点ペース（${TARGET}秒）に近い速さです。`);
